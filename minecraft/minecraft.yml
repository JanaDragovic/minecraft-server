---
 
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: minecraft
  name: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9100'
        prometheus.io/path: '/'
    spec:
      containers:
        - image: localhost/minecraft:v1
          imagePullPolicy: IfNotPresent
          name: minecraft
          ports:
            - containerPort: 25565
              name: game-port
