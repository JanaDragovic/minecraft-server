---
 
apiVersion: v1
kind: Service
metadata:
  labels:
    app: minecraft
  name: minecraft-service
spec:
  type: NodePort
  ports:
    - protocol: TCP
      port: 25565
      targetPort: 25565
      nodePort: 31234
      name: game-tcp
    - protocol: UDP
      port: 25565
      targetPort: 25565
      nodePort: 31234
      name: game-udp
  selector:
    app: minecraft
