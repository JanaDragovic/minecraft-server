kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  image: kindest/node:v1.25.16@sha256:e8b50f8e06b44bb65a93678a65a26248fae585b3d3c2a669e5ca6c90c69dc519
  extraPortMappings:
  - containerPort: 31234
    hostPort: 31234
    protocol: TCP
  - containerPort: 31234
    hostPort: 31234
    protocol: UDP
  - containerPort: 30300
    hostPort: 30300
    protocol: TCP
